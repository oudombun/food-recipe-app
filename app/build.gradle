apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'
apply plugin: "androidx.navigation.safeargs"
apply plugin: 'dagger.hilt.android.plugin'


android {
    namespace "com.oudombun.chelfy"
    signingConfigs {
        release {
            try{
                keyAlias 'release'
                storeFile file('release.jks')
                storePassword KEYSTORE_PASSWORD
                keyPassword KEY_PASSWORD
            }
            catch (ignored) {
                throw new InvalidUserDataException("You should define KEYSTORE_PASSWORD and KEY_PASSWORD in gradle.properties.")
            }
        }

        debug {
            try {
                keyAlias 'debug'
                storeFile file('debug.jks')
                keyPassword KEY_PASSWORD
                storePassword KEYSTORE_PASSWORD
            }
            catch (ignored) {
                throw new InvalidUserDataException("You should define KEYSTORE_PASSWORD and KEY_PASSWORD in gradle.properties.")
            }
        }
    }


    compileSdk 36

    defaultConfig {
        applicationId 'com.oudombun.chelfy'
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", "\"https://api.spoonacular.com\""
            buildConfigField "String", "BASE_IMAGE_URL", "\"https://img.spoonacular.com/ingredients_100x100\""
            buildConfigField "String", "API_KEY", "\"ff929de8ed504e9e8310a345fe2f2212\""
            buildConfigField "String", "API_KEY2", "\"7a0a6c8528ba49418e6541d3a33c3584\""
            buildConfigField "String", "API_KEY3", "\"32b9495b24d24ba095ebe8a1ea1b2e43\""
            testCoverageEnabled = "true"
            debuggable = true
            signingConfig signingConfigs.debug
        }
        release {
            buildConfigField "String", "BASE_URL", "\"https://api.spoonacular.com\""
            buildConfigField "String", "BASE_IMAGE_URL", "\"https://img.spoonacular.com/ingredients_100x100\""
            buildConfigField "String", "API_KEY", "\"ff929de8ed504e9e8310a345fe2f2212\""
            buildConfigField "String", "API_KEY2", "\"7a0a6c8528ba49418e6541d3a33c3584\""
            buildConfigField "String", "API_KEY3", "\"32b9495b24d24ba095ebe8a1ea1b2e43\""
            debuggable = false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding = true
    }
    dataBinding {
        enabled = true
    }

    compileOptions {
//        sourceCompatibility 1.8
//        targetCompatibility 1.8
        sourceCompatibility JavaVersion.VERSION_17 // Use Java 17 compatibility
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    // UPDATE Kotlin standard library
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Coordinator Layout
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"

    // Material Components
    implementation 'com.google.android.material:material:1.12.0'

    // Navigation Component - UPDATE
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // Room components - UPDATE
    implementation 'androidx.room:room-ktx:2.8.4'
    kapt "androidx.room:room-compiler:2.8.4"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Recyclerview
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0" // Updated for compatibility
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Dagger - Hilt - UPDATE
    implementation "com.google.dagger:hilt-android:2.51.1"
    kapt "com.google.dagger:hilt-android-compiler:2.51.1"

    // AndroidX Hilt extensions - UPDATE to the stable artifact
    implementation "androidx.hilt:hilt-navigation-fragment:1.2.0"
    kapt "androidx.hilt:hilt-compiler:1.2.0"

    // Coroutines - UPDATE
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'

    // Lifecycle - UPDATE
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.0"
    // lifecycle-extensions is deprecated, remove it
    // implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"

    // Image Loading library Coil - UPDATE
    implementation "io.coil-kt:coil:2.6.0"

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Jsoup
    implementation 'org.jsoup:jsoup:1.17.2'

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation("com.github.bumptech.glide:glide:4.16.0")
    kapt("com.github.bumptech.glide:compiler:4.16.0")


}